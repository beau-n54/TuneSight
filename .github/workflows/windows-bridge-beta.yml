name: Windows Bridge draft beta
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Relevant read-only bridge and telemetry regressions
        shell: pwsh
        run: node --experimental-strip-types --test lib/vehicle-interface/*.test.ts
      - name: Generate Next.js declarations for a clean checkout
        run: npx next typegen
      - run: npx tsc --noEmit
      - name: Focused lint
        run: npx eslint desktop/bridge/desktopBridge.ts lib/vehicle-interface/bridgeVersion.ts lib/vehicle-interface/enetDiscovery.ts lib/vehicle-interface/bridgeRelease.ts lib/vehicle-interface/desktopBridge.test.ts lib/vehicle-interface/bridgePairing.test.ts lib/vehicle-interface/localBridgeClient.ts scripts/tunesightVehicleBridge.ts components/LiveBridgeControls.tsx components/BridgeDownload.tsx app/bridge/page.tsx lib/vehicle-interface/localBridgePairing.browser.test.tsx scripts/verifyBridgePairingUi.mjs scripts/verifyWindowsBridgeSources.mjs
      - run: git diff --check
      - run: node scripts/verifyWindowsBridgeSources.mjs
      - name: Production web build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-only.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-not-a-subscriber-credential
      - name: Build pinned unsigned beta installer
        shell: pwsh
        run: ./scripts/build-windows-bridge.ps1 -OutputDirectory "$env:RUNNER_TEMP/TuneSight-Bridge-build"
      - name: Install, repair, restart, single instance and uninstall
        shell: pwsh
        run: ./scripts/test-windows-bridge.ps1 -Installer "$env:RUNNER_TEMP/TuneSight-Bridge-build/artifacts/TuneSight-Bridge-0.1.0-beta.1-windows-x64-setup.exe" -InstallDirectory "$env:LOCALAPPDATA/TuneSight-Bridge-CI-test"
      - uses: actions/upload-artifact@v4
        with:
          name: TuneSight-Bridge-0.1.0-beta.1-unsigned-draft
          path: ${{ runner.temp }}/TuneSight-Bridge-build/artifacts/*
          if-no-files-found: error
      - name: Create draft only, never replace an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'bridge-v0.1.0-beta.1'
          gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; review it rather than overwrite artifacts' }
          $notes = "$env:RUNNER_TEMP/bridge-release-notes.md"
          @'
          Unsigned Windows x64 Founder beta. Physical hosted-to-ENET-to-DME validation is pending. Not subscriber-ready. Review BETA-NOTICE and docs/windows-bridge.md. Node is bundled; SmartScreen may warn. No public feed promotion or automatic installation is performed.
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release create $tag "$env:RUNNER_TEMP/TuneSight-Bridge-build/artifacts/*" --draft --prerelease --target $env:GITHUB_SHA --title 'TuneSight Bridge 0.1.0-beta.1 - unsigned Founder beta' --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
